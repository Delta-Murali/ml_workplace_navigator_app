<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="compass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Compass circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8"/>
  <!-- Compass needle -->
  <g transform="translate(256, 256)">
    <!-- North pointer -->
    <polygon points="0,-100 -25,20 0,-10 25,20" fill="#FFFFFF"/>
    <!-- South pointer -->
    <polygon points="0,100 -25,-20 0,10 25,-20" fill="rgba(255,255,255,0.5)"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="15" fill="#FFFFFF"/>
  </g>
  <!-- Cardinal points -->
  <text x="256" y="100" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">N</text>
  <text x="256" y="430" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="28">S</text>
  <text x="100" y="265" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="28">W</text>
  <text x="412" y="265" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="28">E</text>
</svg>
