version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workplace-nav-backend
    environment:
      - DEBUG=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - AZURE_MAPS_CLIENT_ID=${AZURE_MAPS_CLIENT_ID:-}
      - AZURE_MAPS_SUBSCRIPTION_KEY=${AZURE_MAPS_SUBSCRIPTION_KEY:-}
      - AZURE_MAPS_TILESET_ID=${AZURE_MAPS_TILESET_ID:-}
      - AZURE_MAPS_STATESET_ID=${AZURE_MAPS_STATESET_ID:-}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workplace-nav-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
